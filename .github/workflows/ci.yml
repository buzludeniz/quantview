name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel a superseded run on the same ref rather than queueing behind it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libegl1 \
            libgl1 \
            libglib2.0-0 \
            libxkbcommon0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-randr0 \
            libxcb-render-util0 \
            libxcb-shape0 \
            libxcb-xfixes0 \
            libxcb-xinerama0 \
            xvfb

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install the project
        run: |
          uv venv --python ${{ matrix.python-version }}
          # --all-extras pulls in the optional kernel so the surfaces tests run
          # here rather than skipping in CI.
          uv sync --locked --all-extras
          uv pip install pytest pytest-cov pytest-asyncio ruff mypy

      - name: Lint
        run: uv run ruff check .

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Type check
        run: uv run mypy src/quantview

      - name: Test
        run: |
          xvfb-run -a uv run pytest --cov=quantview --cov-report=xml --cov-fail-under=85

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-py${{ matrix.python-version }}
          path: coverage.xml
          if-no-files-found: ignore

  package:
    name: build and install
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Build
        run: uv build

      - name: Check the wheel carries every module
        # A bare "data/" in .gitignore once excluded src/quantview/data/ from
        # the wheel, because hatchling honours gitignore. The local test suite
        # could not catch that: it imports from the source tree.
        run: |
          uv run python - <<'PY'
          import pathlib, zipfile
          wheels = list(pathlib.Path("dist").glob("*.whl"))
          assert wheels, "no wheel produced"
          names = set(zipfile.ZipFile(wheels[0]).namelist())
          required = {
              "quantview/data/__init__.py",
              "quantview/data/connection.py",
              "quantview/data/ingest.py",
              "quantview/data/connectors/base.py",
              "quantview/analytics/__init__.py",
          }
          missing = required - names
          assert not missing, f"wheel is missing {sorted(missing)}"
          print(f"{wheels[0].name}: {len(names)} entries, all required modules present")
          PY

      - name: Smoke test the installed wheel
        # Installs the wheel into a fresh environment and exercises the paths a
        # source-tree run never reaches: no editable install, no local config.
        run: |
          uv venv .smoke-wheel
          uv pip install --python .smoke-wheel/bin/python dist/*.whl
          .smoke-wheel/bin/python - <<'PY'
          import importlib
          import tempfile, pathlib

          for module in (
              "quantview.data.connection",
              "quantview.data.schema",
              "quantview.data.ingest",
              "quantview.analytics.curves",
              "quantview.analytics.portfolio",
              "quantview.notebook.charts",
              "quantview.notebook.export",
              "quantview.notebook.widgets",
              "quantview.desktop.main",
          ):
              importlib.import_module(module)

          from quantview.data.connection import (
              close_connection, connection_context, check_connection,
          )
          import quantview.data.connection as cn

          tmp = pathlib.Path(tempfile.mkdtemp()) / "smoke.duckdb"

          class _Settings:
              data_path = tmp

          cn.get_settings = lambda: _Settings
          cn.close_connection()
          cn._initialized = False

          assert check_connection() is True
          with connection_context() as conn:
              conn.execute("CREATE TABLE t (a INTEGER)")
              conn.execute("INSERT INTO t VALUES (42)")
              assert conn.execute("SELECT a FROM t").fetchone()[0] == 42
          close_connection()

          import numpy as np
          from quantview.analytics.curves import fit_nss, forward_curve

          tenors = np.array([1.0, 2.0, 3.0, 5.0, 7.0, 10.0])
          rates = np.array([0.040, 0.042, 0.043, 0.044, 0.0445, 0.045])
          fit = fit_nss(tenors, rates)
          forwards = forward_curve(fit, tenors)
          assert len(forwards) == len(tenors) and np.all(np.isfinite(forwards))

          print("wheel smoke test passed")
          PY